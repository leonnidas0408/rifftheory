<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <meta name="theme-color" content="#0D0D0D" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black" />
        <meta name="apple-mobile-web-app-title" content="Riff Theory" />
        <title>Riff Theory</title>
        <link rel="manifest" href="manifest.json" />
        <link rel="apple-touch-icon" href="icon-512.png" />
        <style>
            :root {
                --preto: #0d0d0d;
                --carvao: #1a1a1a;
                --grafite: #2a2a2a;
                --dourado: #c9933a;
                --dourado2: #e8b44a;
                --branco: #f0f0f0;
                --cinza: #888888;
                --vermelho: #d94f3d;
                --verde: #4caf76;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                -webkit-tap-highlight-color: transparent;
            }

            body {
                background: var(--preto);
                color: var(--branco);
                font-family: "Segoe UI", Arial, sans-serif;
                min-height: 100dvh;
            }

            /* header */
            header {
                background: var(--carvao);
                padding: 14px 16px;
                display: flex;
                align-items: center;
                gap: 10px;
                position: sticky;
                top: 0;
                z-index: 10;
            }

            header h1 {
                font-size: 20px;
                color: var(--dourado);
                font-weight: 700;
                letter-spacing: 0.5px;
            }

            header span {
                font-size: 11px;
                color: var(--cinza);
            }

            /* entrada */
            .entrada {
                background: var(--grafite);
                margin: 12px;
                border-radius: 12px;
                padding: 14px;
            }

            .entrada label {
                font-size: 12px;
                font-weight: 700;
                color: var(--dourado);
                text-transform: uppercase;
                letter-spacing: 1px;
                display: block;
                margin-bottom: 8px;
            }

            .row {
                display: flex;
                gap: 8px;
            }

            input[type="text"] {
                flex: 1;
                background: var(--carvao);
                border: 1.5px solid var(--dourado);
                color: var(--branco);
                border-radius: 8px;
                padding: 10px 12px;
                font-size: 15px;
                outline: none;
                font-family: "Courier New", monospace;
            }

            input::placeholder {
                color: var(--cinza);
                font-size: 13px;
            }

            input:focus {
                border-color: var(--dourado2);
            }

            button.gerar {
                background: var(--dourado);
                color: var(--preto);
                border: none;
                border-radius: 8px;
                padding: 10px 16px;
                font-size: 14px;
                font-weight: 700;
                cursor: pointer;
                white-space: nowrap;
                transition: background 0.15s;
            }

            button.gerar:active {
                background: var(--dourado2);
            }

            .erro {
                color: var(--vermelho);
                font-size: 12px;
                margin-top: 8px;
                min-height: 16px;
            }

            /* resultado */
            .resultado {
                margin: 0 12px 12px;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .card {
                background: var(--grafite);
                border-radius: 12px;
                padding: 14px;
            }

            .card-titulo {
                font-size: 11px;
                font-weight: 700;
                color: var(--dourado);
                text-transform: uppercase;
                letter-spacing: 1px;
                margin-bottom: 6px;
            }

            .card-valor {
                font-family: "Courier New", monospace;
                font-size: 14px;
                color: var(--branco);
                line-height: 1.6;
            }

            .card-valor.italic {
                font-style: italic;
                color: #aaaaaa;
                font-family: inherit;
                font-size: 13px;
            }

            /* acordes chips */
            .chips {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                margin-top: 4px;
            }

            .chip {
                background: var(--carvao);
                border: 1.5px solid var(--grafite);
                color: var(--branco);
                border-radius: 20px;
                padding: 5px 12px;
                font-size: 13px;
                font-family: "Courier New", monospace;
                cursor: pointer;
                transition: all 0.15s;
            }

            .chip.ativo {
                border-color: var(--dourado);
                color: var(--dourado);
                background: #2a2000;
            }

            .chip.indisponivel {
                opacity: 0.45;
                cursor: default;
            }

            /* campo harmônico (graus) */
            .campo {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                margin-top: 4px;
            }

            .grau-item {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 5px;
            }

            .grau-num {
                font-size: 11px;
                font-weight: 700;
                color: var(--dourado);
                font-family: "Courier New", monospace;
            }

            /* braço */
            .braco-card {
                background: var(--grafite);
                border-radius: 12px;
                padding: 14px;
            }

            .braco-titulo {
                font-size: 11px;
                font-weight: 700;
                color: var(--dourado);
                text-transform: uppercase;
                letter-spacing: 1px;
                margin-bottom: 2px;
            }

            .braco-dica {
                font-size: 11px;
                color: var(--cinza);
                margin-bottom: 10px;
            }

            .braco-header {
                display: flex;
                justify-content: space-between;
                align-items: flex-end;
                margin-bottom: 6px;
                gap: 8px;
            }

            #braco-nome {
                font-size: 22px;
                font-weight: 700;
                color: var(--dourado2);
                font-family: "Courier New", monospace;
                line-height: 1.1;
            }

            #braco-notas {
                font-size: 12px;
                color: var(--cinza);
                font-family: "Courier New", monospace;
                margin-top: 2px;
            }

            canvas#braco {
                display: block;
                margin: 0 auto;
                border-radius: 8px;
                background: var(--carvao);
                cursor: pointer;
                touch-action: manipulation;
                max-width: 100%;
            }

            .braco-controles {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                margin-top: 10px;
            }

            .braco-controles button {
                background: var(--carvao);
                border: 1.5px solid var(--grafite);
                color: var(--branco);
                border-radius: 8px;
                padding: 6px 12px;
                font-size: 13px;
                font-weight: 700;
                cursor: pointer;
                font-family: "Courier New", monospace;
                transition: all 0.15s;
            }

            .braco-controles button:active {
                border-color: var(--dourado);
                color: var(--dourado);
            }

            .braco-controles button.limpar {
                color: var(--vermelho);
                border-color: #4a2a25;
            }

            #braco-janela {
                font-size: 12px;
                color: var(--cinza);
                min-width: 88px;
                text-align: center;
            }

            /* rodape */
            footer {
                text-align: center;
                padding: 12px;
                color: #444;
                font-size: 10px;
            }
        </style>
    </head>

    <body>
        <header>
            <h1>🎸 Riff Theory</h1>
            <span>Escalas · Campo harmônico · Braço interativo</span>
        </header>

        <div class="entrada">
            <label>Nota e escala</label>
            <div class="row">
                <input type="text" id="campo" placeholder="Ex: C maior | Am | G blues | F# menor" autocomplete="off"
                    autocorrect="off" spellcheck="false" />
                <button class="gerar" onclick="gerar()">GERAR ▶</button>
            </div>
            <div class="erro" id="erro"></div>
        </div>

        <div class="resultado" id="resultado" style="display: none">
            <div class="card">
                <div class="card-titulo">Escala</div>
                <div class="card-valor" id="r-escala">—</div>
            </div>

            <div class="card">
                <div class="card-titulo">Campo harmônico</div>
                <div class="campo" id="r-campo"></div>
            </div>

            <div class="card">
                <div class="card-titulo">Estilo musical</div>
                <div class="card-valor italic" id="r-estilo">—</div>
            </div>

            <div class="braco-card">
                <div class="braco-titulo">Braço interativo</div>
                <div class="braco-dica">
                    Toque numa corda pra abrir/abafar · toque numa casa pra dedilhar
                </div>
                <div class="braco-header">
                    <div>
                        <div id="braco-nome">—</div>
                        <div id="braco-notas"></div>
                    </div>
                </div>
                <canvas id="braco" width="320" height="220"></canvas>
                <div class="braco-controles">
                    <button onclick="moverJanela(-1)">‹ casa</button>
                    <span id="braco-janela">Aberta</span>
                    <button onclick="moverJanela(1)">casa ›</button>
                    <button class="limpar" onclick="limparBraco()">limpar</button>
                </div>
            </div>
        </div>

        <footer>Riff Theory · escalas · campo harmônico · braço interativo</footer>

        <script src="draw.js"></script>
        <script src="resources.js"></script>
